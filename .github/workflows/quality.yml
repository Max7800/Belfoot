name: Qualite du projet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: belfoot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d belfoot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: belfoot_test
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v7
      - name: Tester les ecritures simultanees
        run: bash tests/football/rbfaConcurrency.sh
      - name: Tester la protection concurrente des clubs
        run: bash tests/football/lockedPlayerConcurrency.sh

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      # v7 : actions sur Node 24 (Node 20 déprécié sur les runners GitHub, avertissement du 25/10/2026).
      - name: Recuperer le depot
        uses: actions/checkout@v7
      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          # Vitest 5 exige Node ^22.12 (ou ^24) ; Next 16 accepte >=20.9.
          node-version: 22
          cache: npm
      - name: Installer les dependances
        run: npm ci
      - name: Detecter un token GitHub commite
        shell: bash
        run: |
          if git grep -nE 'ghp_[A-Za-z0-9]{30,}' -- .; then
            echo "Un token GitHub semble present dans le depot."
            exit 1
          fi
      - name: Lint
        run: npm run lint
      - name: Tests automatises
        run: npm test
      - name: Build de production
        run: npm run build
